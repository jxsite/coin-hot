<script>
function copyTweet(btn){
var t='【CoinHOT精选·AI评分'+btn.dataset.score+'】'+btn.dataset.title+' '+btn.dataset.url;
function done(){var o=btn.textContent;btn.textContent='已复制 ✓';setTimeout(function(){btn.textContent=o;},1500);}
function fallback(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(fallback);}else{fallback();}
}
</script><script>
(function(){
var key='coinhot-theme';
function label(m){return m==='auto'?'\U0001F313 自动':(m==='dark'?'\U0001F319 深色':'\2600\FE0F 浅色');}
function apply(m){
var dark=m==='dark'||(m==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',dark?'dark':'light');
var b=document.getElementById('themeBtn');
if(b){b.textContent=label(m);b.title='点击切换主题（当前：'+(m==='auto'?'跟随系统':(m==='dark'?'深色模式':'浅色模式'))+'）';}
}
var cur='auto';try{cur=localStorage.getItem(key)||'auto';}catch(e){}
apply(cur);
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){var m='auto';try{m=localStorage.getItem(key)||'auto';}catch(e){}if(m==='auto')apply('auto');});}catch(e){}}
window.toggleTheme=function(){var m='auto';try{m=localStorage.getItem(key)||'auto';}catch(e){}m=m==='auto'?'light':(m==='light'?'dark':'auto');try{localStorage.setItem(key,m);}catch(e){}apply(m);};
})();
